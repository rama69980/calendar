name: Build macOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # GitHub 웹페이지에서 수동 실행 버튼 지원

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: |
          flutter pub get
          cd macos && pod install || true
          cd ..

      - name: Build macOS App
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: flutter build macos --release --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" --dart-define=GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"

      - name: Compress macOS App (.zip)
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app ../../../../../Calendar-MacOS.zip
          cd ../../../../../

      - name: Upload macOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calendar-MacOS-App
          path: Calendar-MacOS.zip
          if-no-files-found: error
